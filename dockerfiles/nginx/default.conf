server {
    listen 80;
    index index.php index.html;
    server_name _;
    root /var/www/html/public;

    # Redirect logs to Docker's stdout and stderr
    access_log /dev/stdout;
    error_log /dev/stderr;

    location / {
        
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite-hashed assets: immutable 1-year cache (filename changes on every build)
    location /build/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Static media / fonts: moderate 7-day cache
    location ~* \.(ico|gif|jpe?g|png|svg|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param PHP_VALUE "auto_prepend_file= \n allow_url_include=Off";
        # HTML responses must never be cached; they carry fresh asset URLs
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }
}