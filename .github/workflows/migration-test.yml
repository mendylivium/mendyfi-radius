name: Migration Test

on:
  push:
    paths:
      - 'migration/**'
      - '.github/workflows/migration-test.yml'
  pull_request:
    paths:
      - 'migration/**'
      - '.github/workflows/migration-test.yml'

jobs:
  test-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        # Use 8.0 specifically: pgloader's qmynd driver does not support
        # caching_sha2_password (default in 8.4+). 8.0 uses
        # mysql_native_password by default which qmynd supports.
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_USER: mendyfi
          MYSQL_PASSWORD: mendyfi_test
          MYSQL_DATABASE: mendyfi_central
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Seed MySQL with test data
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -ptest < migration/seed-test-data.sql

      - name: Switch root auth to mysql_native_password for pgloader compatibility
        # pgloader's qmynd driver does not support caching_sha2_password (MySQL 8.0+ default).
        # MySQL 8.0 still has the mysql_native_password plugin available (unlike 8.4+ which removed it).
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -ptest \
            -e "ALTER USER 'root'@'%' IDENTIFIED WITH mysql_native_password BY 'test'; FLUSH PRIVILEGES;"

      - name: Create .env for migration
        run: |
          cat > .env <<'ENVEOF'
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=mendyfi_central
          DB_USERNAME=root
          DB_PASSWORD=test
          ENVEOF

      - name: Run migration dry-run first
        run: ./migration/migrate.sh --dry-run

      - name: Run migration
        env:
          PG_USER: mendyfi
          PG_PASS: mendyfi_test_pg
          CI_MODE: "true"
        run: ./migration/migrate.sh --ci-mode --pg-port 5433

      - name: Verify PostgreSQL databases exist
        run: |
          cd migration && docker compose -f docker-compose.migrate.yml exec -T postgres \
            psql -U mendyfi -d mendyfi_central -c "SELECT COUNT(*) FROM tenants;"

      - name: Verify tenant databases
        run: |
          cd migration && docker compose -f docker-compose.migrate.yml exec -T postgres \
            psql -U mendyfi -l | grep mendyfi_tenant

      - name: Cleanup
        if: always()
        run: |
          cd migration && docker compose -f docker-compose.migrate.yml down -v 2>/dev/null || true
